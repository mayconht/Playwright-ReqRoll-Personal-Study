name: Playwright-ReqRoll Tests

on:
  workflow_dispatch:
    inputs:
      browser_type:
        description: 'Browser type'
        required: false
        default: 'chromium'
        type: choice
        options:
        - chromium
        - firefox
        - webkit
      headless:
        description: 'Run in headless mode'
        required: false
        default: true
        type: boolean
      enable_tracing:
        description: 'Enable tracing'
        required: false
        default: true
        type: boolean
      enable_video:
        description: 'Enable video recording'
        required: false
        default: true
        type: boolean
      enable_screenshots:
        description: 'Enable screenshots'
        required: false
        default: true
        type: boolean
  push:
    branches: [ master, dev ]
  pull_request:
    branches: [ master, dev ]
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  checks: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: 'Build and Test'
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright/dotnet:v1.55.0-noble
      options: --ipc=host

    env:
      CI: true
      REPORTS__PATH: ./reports
      TRACING__TRACESPATH: Playwright-Traces
      VIDEO__DIR: Playwright-Videos
      SCREENSHOTS__DIR: Playwright-Screenshots
      DOWNLOADS__PATH: Downloads
      BROWSER__TYPE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.browser_type || 'chromium' }}
      BROWSER__HEADLESS: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.headless || 'true' }}
      TRACING__SAVEONPASS: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.enable_tracing || 'true' }}
      VIDEO__RECORD: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.enable_video || 'true' }}
      SCREENSHOTS__ONSUCCESS: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.enable_screenshots || 'true' }}
      SCREENSHOTS__ONFAILURE: 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK 8.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore NuGet packages
        run: dotnet restore

      - name: Build solution
        run: dotnet build --configuration Release --no-restore

      - name: Run Tests
        id: run-tests
        run: |
          dotnet test --configuration Release --no-build \
            --logger "trx;LogFileName=test-results.trx" \
            --results-directory "./TestResults"
        continue-on-error: true

      - name: Publish Test Results
        if: always()
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: 'TestResults/**/*.trx'
          check_name: 'Playwright-ReqRoll Tests - ${{ env.BROWSER__TYPE }}'
          comment_title: 'Playwright-ReqRoll Test Results'
          comment_mode: always
          report_individual_runs: true
          compare_to_earlier_commit: true
          check_run_annotations: all tests, skipped tests
          job_summary: true

      - name: Publish Test Results Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/
          if-no-files-found: ignore

      - name: Publish Playwright Traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: reports/Playwright-Traces/
          if-no-files-found: ignore

      - name: Publish Playwright Videos
        if: ${{ always() && env.VIDEO__RECORD == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-videos
          path: reports/Playwright-Videos/
          if-no-files-found: ignore

      - name: Publish Playwright Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-screenshots
          path: reports/Playwright-Screenshots/
          if-no-files-found: ignore

      - name: Check test status
        if: steps.run-tests.outcome == 'failure'
        run: |
          echo "::error::Playwright tests failed!"
          exit 1
