# ============================================================
# GitHub Actions Pipeline for Playwright-ReqRoll Tests
# ============================================================

name: Playwright-ReqRoll Tests

on:
  workflow_dispatch:
    inputs:
      browser_type:
        description: 'Browser type'
        required: false
        default: 'chromium'
        type: choice
        options:
        - chromium
        - firefox
        - webkit
      headless:
        description: 'Run in headless mode'
        required: false
        default: true
        type: boolean
      categories:
        description: 'Test categories to run (e.g., Login,Search)'
        required: false
        default: 'Login,Search'
        type: string
      enable_tracing:
        description: 'Enable tracing'
        required: false
        default: true
        type: boolean
      enable_video:
        description: 'Enable video recording'
        required: false
        default: true
        type: boolean
      enable_screenshots:
        description: 'Enable screenshots'
        required: false
        default: true
        type: boolean
  push:
    branches: [ main, master, develop, dev ]
  pull_request:
    branches: [ main, master, develop, dev ]
    types: [opened, synchronize, reopened]

# Required for mikepenz/action-junit-report to create check runs
permissions:
  contents: read
  checks: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================
  # JOB: Build, Test and Analyze
  # ============================================================
  build-and-test:
    name: 'Build and Test'
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright/dotnet:v1.55.0-noble
      options: --ipc=host

    env:
      CI: true
      REPORTS__PATH: ${{ github.workspace }}/reports
      TRACING__TRACESPATH: Playwright-Traces
      VIDEO__DIR: Playwright-Videos
      SCREENSHOTS__DIR: Playwright-Screenshots
      DOWNLOADS__PATH: Downloads
      BROWSER__TYPE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.browser_type || 'chromium' }}
      BROWSER__HEADLESS: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.headless || 'true' }}
      TRACING__SAVEONPASS: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.enable_tracing || 'true' }}
      VIDEO__RECORD: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.enable_video || 'true' }}
      SCREENSHOTS__ONSUCCESS: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.enable_screenshots || 'true' }}
      SCREENSHOTS__ONFAILURE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.enable_screenshots || 'true' }}

    steps:
      # ============================================================
      # CHECKOUT
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # SETUP .NET SDK
      # ============================================================
      - name: Setup .NET SDK 8.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      # ============================================================
      # RESTORE NUGET PACKAGES
      # ============================================================
      - name: Restore NuGet packages
        run: dotnet restore

      # ============================================================
      # BUILD SOLUTION
      # ============================================================
      - name: Build solution
        run: dotnet build --configuration Release --no-restore

      # ============================================================
      # RUN TESTS
      # ============================================================
      - name: Run Tests
        id: run-tests
        run: |
          dotnet test --configuration Release --no-build \
            --logger "trx;LogFileName=test-results.trx" \
            --results-directory "${{ github.workspace }}/TestResults"
        continue-on-error: true

      # ============================================================
      # GENERATE TEST SUMMARY
      # ============================================================
      - name: Generate Test Summary
        if: always()
        run: |
          echo "### Playwright-ReqRoll Tests - ${{ env.BROWSER__TYPE }} :test_tube:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ -f "${{ github.workspace }}/TestResults/test-results.trx" ]; then
            # Parse TRX file for summary using grep
            TOTAL=$(grep -oP 'total="\K[^"]+' "${{ github.workspace }}/TestResults/test-results.trx" | head -1 || echo "0")
            PASSED=$(grep -oP 'passed="\K[^"]+' "${{ github.workspace }}/TestResults/test-results.trx" | head -1 || echo "0")
            FAILED=$(grep -oP 'failed="\K[^"]+' "${{ github.workspace }}/TestResults/test-results.trx" | head -1 || echo "0")
            EXECUTED=$(grep -oP 'executed="\K[^"]+' "${{ github.workspace }}/TestResults/test-results.trx" | head -1 || echo "0")

            echo "| Metric | Result |" >> $GITHUB_STEP_SUMMARY
            echo "|--------|--------|" >> $GITHUB_STEP_SUMMARY
            echo "| :clipboard: Total | ${TOTAL} |" >> $GITHUB_STEP_SUMMARY
            echo "| :white_check_mark: Passed | ${PASSED} |" >> $GITHUB_STEP_SUMMARY
            echo "| :x: Failed | ${FAILED} |" >> $GITHUB_STEP_SUMMARY
            echo "| :arrow_forward: Executed | ${EXECUTED} |" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY

            echo "**Configuration:**" >> $GITHUB_STEP_SUMMARY
            echo "- Browser: \`${{ env.BROWSER__TYPE }}\`" >> $GITHUB_STEP_SUMMARY
            echo "- Headless: \`${{ env.BROWSER__HEADLESS }}\`" >> $GITHUB_STEP_SUMMARY
            echo "- Tracing: \`${{ env.TRACING__SAVEONPASS }}\`" >> $GITHUB_STEP_SUMMARY
            echo "- Video: \`${{ env.VIDEO__RECORD }}\`" >> $GITHUB_STEP_SUMMARY
            echo "- Screenshots: \`${{ env.SCREENSHOTS__ONSUCCESS }}\`" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY

            if [ "$FAILED" -eq 0 ]; then
              echo "**Status:** :white_check_mark: All tests passed" >> $GITHUB_STEP_SUMMARY
            else
              echo "**Status:** :x: Some tests failed (${FAILED} failures)" >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo ":warning: Test results file not found" >> $GITHUB_STEP_SUMMARY
          fi

      # ============================================================
      # PUBLISH TEST RESULTS
      # ============================================================
      - name: Publish Test Results
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: 'Playwright-ReqRoll Tests - ${{ env.BROWSER__TYPE }}'
          path: '${{ github.workspace }}/TestResults/*.trx'
          reporter: 'dotnet-trx'
          fail-on-error: true

      # ============================================================
      # UPLOAD ARTIFACTS
      # ============================================================
      - name: Publish Test Results Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ${{ github.workspace }}/TestResults/
          if-no-files-found: ignore

      - name: Publish Playwright Traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: ${{ github.workspace }}/reports/Playwright-Traces/
          if-no-files-found: ignore

      - name: Publish Playwright Videos
        if: ${{ always() && env.VIDEO__RECORD == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-videos
          path: ${{ github.workspace }}/reports/Playwright-Videos/
          if-no-files-found: ignore

      - name: Publish Playwright Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-screenshots
          path: ${{ github.workspace }}/reports/Playwright-Screenshots/
          if-no-files-found: ignore

      # ============================================================
      # CHECK TEST STATUS
      # ============================================================
      - name: Check test status
        if: steps.run-tests.outcome == 'failure'
        run: |
          echo "::error::Playwright tests failed!"
          exit 1
